<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>iiSU Presentation Countdown</title>

    <style>
        @font-face {
            font-family: 'ContinuumMedium';
            src: url('ContinuumMedium.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
        }

        body {
            background: #111;
            color: #fff;
            font-family: 'ContinuumMedium', sans-serif;
            text-align: center;
            padding-top: 50px;
        }

        h1 {
            font-size: 48px;
            margin-top: 20px;
            margin-bottom: 10px;
            cursor: pointer;  
        }

        .subtitle {
            font-size: 18px;
            color: #bbb;
            margin-bottom: 40px;
        }

        #countdown {
            font-size: 36px;
            letter-spacing: 2px;
            margin-bottom: 40px;
        }

        img.logo {
            width: 250px;
            margin-bottom: 20px;
        }

        .youtube-embed {
            margin-top: 40px;
            width: 100%;
            height: 315px;
            background: #000;
            border: none;
        }

        .youtube-link {
            color: #00ff00;
            text-decoration: none;
            font-size: 20px;
            margin-top: 20px;
            display: inline-block;
        }

        .youtube-link:hover {
            text-decoration: underline;
        }

        #usagi {
            position: fixed;
            bottom: -200px;
            right: 20px;
            width: 100px;
            z-index: 9999;
            transition: bottom 0.5s ease; /* oo so Smooth  */
        }

        .slide-up {
            bottom: 20px;
        }

        .slide-down {
            bottom: -200px;
        }
    </style>
</head>
<body>

    <audio id="bgm" src="music.mp3" autoplay loop muted></audio>

    <img src="iisu.png" class="logo" alt="iiSU Logo">

    <h1>iiSU Presentation Countdown</h1>
    <p class="subtitle">Unofficial Website. Countdown is not final.</p>

    <div id="countdown">Loading...</div>

    <img id="usagi" src="usagi.gif" alt="Usagi GIF">

    <!-- Link to the YouTube Channel. Will be used later -->
    <a href="https://www.youtube.com/c/usagishade" target="_blank" class="youtube-link">
        
    </a>

    <script>
        const bgm = document.getElementById("bgm");
        const usagi = document.getElementById("usagi");
        const countdownText = document.getElementById("countdown");

        // Countdown
        const targetDate = new Date("2025-11-25T09:00:00-08:00").getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const difference = targetDate - now;

            if (difference <= 0) {
                countdownText.innerHTML = "The presentation has started!";
                return;
            }

            const days = Math.floor(difference / (1000 * 60 * 60 * 24));
            const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((difference % (1000 * 60)) / 1000);

            countdownText.innerHTML =
                `${days}d ${hours}h ${minutes}m ${seconds}s`;
        }

        updateCountdown();
        setInterval(updateCountdown, 1000);

        function enableAudioOnce() {
            bgm.muted = false;      // unmute
            bgm.volume = 1.0;       // set volume
            bgm.play();             // plays it

            document.removeEventListener("click", enableAudioOnce);
        }

        document.addEventListener("click", enableAudioOnce);

        document.querySelector("h1").addEventListener("click", () => {
            usagi.classList.add("slide-up");
            setTimeout(() => {
                usagi.classList.remove("slide-up");
                usagi.classList.add("slide-down");
            }, 4000); // 4 seconds
        });

    </script>

</body>
</html>
