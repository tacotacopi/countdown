<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>iiSU Presentation Countdown</title>

    <style>
        @font-face {
            font-family: 'ContinuumMedium';
            src: url('ContinuumMedium.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
        }

        body {
            background: #111;
            color: #fff;
            font-family: 'ContinuumMedium', sans-serif;
            text-align: center;
            padding-top: 50px;
        }

        h1 {
            font-size: 48px;
            margin-top: 20px;
            margin-bottom: 10px;
            cursor: pointer;  /* Make it look clickable */
        }

        .subtitle {
            font-size: 18px;
            color: #bbb;
            margin-bottom: 40px;
        }

        #countdown {
            font-size: 36px;
            letter-spacing: 2px;
            margin-bottom: 40px;
        }

        img.logo {
            width: 250px;
            margin-bottom: 20px;
        }

        /* Usagi GIF styles */
    #usagi {
        position: fixed;
        bottom: -200px;
        right: 20px;
        width: 200px;
        z-index: 9999;
        background: rgba(0,0,0,0.5);
        transition: transform 0.5s ease; /* Transitioning transform for smoother animation */
    }

    .slide-up {
        transform: translateY(-220px); /* Moves the GIF up */
    }

    .slide-down {
        transform: translateY(200px); /* Moves it back down */
    }
    </style>
</head>
<body>

    <!-- Background Music -->
    <audio id="bgm" src="music.mp3" autoplay loop muted></audio>

    <!-- Logo -->
    <img src="iisu.png" class="logo" alt="iiSU Logo">

    <h1>iiSU Presentation Countdown</h1>
    <p class="subtitle">Unofficial Website. Countdown is not final.</p>

    <div id="countdown">Loading...</div>

    <!-- Usagi GIF (hidden by default) -->
    <img id="usagi" src="usagi.gif" alt="Usagi GIF">

    <script>
        const bgm = document.getElementById("bgm");
        const usagi = document.getElementById("usagi");
        const countdownText = document.getElementById("countdown");

        // Countdown logic
        const targetDate = new Date("2025-11-25T09:00:00-08:00").getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const difference = targetDate - now;

            if (difference <= 0) {
                countdownText.innerHTML = "The presentation has started!";
                return;
            }

            const days = Math.floor(difference / (1000 * 60 * 60 * 24));
            const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((difference % (1000 * 60)) / 1000);

            countdownText.innerHTML =
                `${days}d ${hours}h ${minutes}m ${seconds}s`;
        }

        updateCountdown();
        setInterval(updateCountdown, 1000);

        function enableAudioOnce() {
            bgm.muted = false;      // unmute
            bgm.volume = 1.0;       // set volume
            bgm.play();             // force play in case browser paused it

            // Remove listener so it runs only once
            document.removeEventListener("click", enableAudioOnce);
        }

        // Listen for first user interaction
        document.addEventListener("click", enableAudioOnce);

        // --- NEW CODE: Trigger Usagi animation ---
        document.querySelector("h1").addEventListener("click", () => {
            console.log("Heading clicked");  // Check if the click is triggered

            // Slide up the usagi.gif
            usagi.classList.add("slide-up");
            console.log("Slide up triggered");

            // Slide it back down after 4 seconds
            setTimeout(() => {
                usagi.classList.remove("slide-up");
                usagi.classList.add("slide-down");
                console.log("Slide down triggered");
            }, 4000); // 4 seconds
        });

    </script>

</body>
</html>
