<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>iiSU Presentation Countdown</title>

    <style>
        @font-face {
            font-family: 'ContinuumMedium';
            src: url('ContinuumMedium.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
        }

        body {
            background: #111;
            color: #fff;
            font-family: 'ContinuumMedium', sans-serif;
            text-align: center;
            padding-top: 50px;
        }

        h1 {
            font-size: 48px;
            margin-top: 20px;
            margin-bottom: 10px;
            cursor: pointer;  /* Make it look clickable */
        }

        .subtitle {
            font-size: 18px;
            color: #bbb;
            margin-bottom: 40px;
        }

        #countdown {
            font-size: 36px;
            letter-spacing: 2px;
            margin-bottom: 40px;
        }

        img.logo {
            width: 250px;
            margin-bottom: 20px;
        }

        /* Usagi GIF styles */
    #usagi {
        position: fixed;
        bottom: -300px;
        right: 20px;
        width: 200px;
        z-index: 9999;
        background: rgba(0,0,0,0);
        transition: transform 0.5s ease; /* Transitioning transform for smoother animation */
    }

    .slide-up {
        transform: translateY(-320px); /* Moves the GIF up */
    }

    .slide-down {
        transform: translateY(300px); /* Moves it back down */
    }
    </style>
</head>
<body>

    <!-- Background Music -->
    <audio id="bgm" src="music.mp3" autoplay loop muted></audio>

    <!-- Logo -->
    <img src="iisu.png" class="logo" alt="iiSU Logo">

    <h1>iiSU Presentation Countdown</h1>
    <p class="subtitle">Unofficial Website. Countdown is not final.</p>

    <div id="countdown">Loading...</div>

    <!-- Usagi GIF (hidden by default) -->
    <img id="usagi" src="usagi.gif" alt="Usagi GIF">

<script>
    const bgm = document.getElementById("bgm");
    const usagi = document.getElementById("usagi");
    const countdownText = document.getElementById("countdown");

    // NEW: Chirp sound
    const chirp = new Audio("chirper1.ogg");
    chirp.preload = "auto";

    // Countdown logic
    const targetDate = new Date("2025-11-25T09:00:00-08:00").getTime();

    function updateCountdown() {
        const now = new Date().getTime();
        const difference = targetDate - now;

        if (difference <= 0) {
            countdownText.innerHTML = "The presentation has started!";
            return;
        }

        const days = Math.floor(difference / (1000 * 60 * 60 * 24));
        const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((difference % (1000 * 60)) / 1000);

        countdownText.innerHTML =
            `${days}d ${hours}h ${minutes}m ${seconds}s`;
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);

    function enableAudioOnce() {
        bgm.muted = false;
        bgm.volume = 1.0;
        bgm.play();

        document.removeEventListener("click", enableAudioOnce);
    }

    document.addEventListener("click", enableAudioOnce);

    // --- Trigger Usagi animation and chirp ---
    document.querySelector("h1").addEventListener("click", () => {

        // Slide Usagi up
        usagi.classList.remove("slide-down");
        usagi.classList.add("slide-up");

        // Play chirp once
        chirp.currentTime = 0;  // restart sound
        chirp.play().catch(err => console.log("Audio play blocked:", err));

        // Slide back down after 4s
        setTimeout(() => {
            usagi.classList.remove("slide-up");
            usagi.classList.add("slide-down");
        }, 4000);
    });
</script>

</body>
</html>
