<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>iiSU Presentation Countdown</title>

    <!-- Sol Black Font -->
    <style>
        @font-face {
            font-family: 'ContinuumMedium';
            src: url('ContinuumMedium.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
        }

        body {
            background: #111;
            color: #fff;
            font-family: 'ContinuumMedium', sans-serif;
            text-align: center;
            padding-top: 50px;
        }

        h1 {
            font-size: 48px;
            margin-top: 20px;
            margin-bottom: 40px;
        }

        #countdown {
            font-size: 36px;
            letter-spacing: 2px;
        }

        img.logo {
            width: 250px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <!-- Background Music -->
    <audio id="bgm" src="music.mp3" autoplay loop muted></audio>

    <!-- Logo -->
    <img src="iisu.png" class="logo" alt="iiSU Logo">

    <h1>iiSU Presentation Countdown</h1>
    <div id="countdown">Loading...</div>

    <script>
        // Try to force autoplay (may fail depending on browser rules)
        const bgm = document.getElementById("bgm");
        bgm.volume = 1.0;

        // Countdown logic
        const targetDate = new Date("2025-11-20T12:00:00+09:00").getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const difference = targetDate - now;

            if (difference <= 0) {
                document.getElementById("countdown").innerHTML = "The presentation has started!";
                return;
            }

            const days = Math.floor(difference / (1000 * 60 * 60 * 24));
            const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((difference % (1000 * 60)) / 1000);

            document.getElementById("countdown").innerHTML =
                `${days}d ${hours}h ${minutes}m ${seconds}s`;
        }

        updateCountdown();
        setInterval(updateCountdown, 1000);
    </script>

</body>
</html>
