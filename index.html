<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>iiSU Presentation Countdown</title>

    <style>
        @font-face {
            font-family: 'ContinuumMedium';
            src: url('ContinuumMedium.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
        }

        body {
            background: #111;
            color: #fff;
            font-family: 'ContinuumMedium', sans-serif;
            text-align: center;
            padding-top: 50px;
        }

        h1 {
            font-size: 48px;
            margin-top: 20px;
            margin-bottom: 10px;
            cursor: pointer;
        }

        .subtitle {
            font-size: 18px;
            color: #bbb;
            margin-bottom: 40px;
        }

        #countdown {
            font-size: 36px;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }

        #timezoneInfo {
            font-size: 18px;
            color: #ccc;
            margin-bottom: 40px;
        }

        img.logo {
            width: 250px;
            margin-bottom: 20px;
            cursor: pointer;
        }

        #usagi {
            position: fixed;
            bottom: -300px;
            right: 20px;
            width: 200px;
            z-index: 9999;
            background: rgba(0,0,0,0);
            transition: transform 0.5s ease;
        }

        .slide-up {
            transform: translateY(-320px);
        }

        .slide-down {
            transform: translateY(300px);
        }

        #muteButton {
            position: fixed;
            top: 10px;
            left: 10px;
            background-color: rgba(0, 0, 0, 0.6);
            color: #fff;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
            font-size: 14px;
            border-radius: 5px;
            z-index: 10000;
        }

        #muteButton:hover {
            background-color: rgba(0, 0, 0, 0.8);
        }

        /* ---- PEAM POPUP ---- */
        #peam {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 250px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s ease;
            z-index: 10001;
        }
        #peam.show {
            opacity: 1;
        }
    </style>
</head>
<body>

    <!-- Background Music -->
    <audio id="bgm" src="music.mp3" autoplay loop muted></audio>

    <!-- Logo -->
    <img src="iisu.png" class="logo" alt="iiSU Logo">

    <h1>iiSU Presentation Countdown</h1>
    <p class="subtitle">Unofficial Website.</p>

    <div id="countdown">Loading...</div>

    <div id="timezoneInfo">finding your time zone...</div>

    <img id="usagi" src="usagi.gif" alt="Usagi GIF">
    
    <img id="peam" src="peam.gif" alt="Peam GIF">

    <button id="muteButton">🔇</button>

<script>
    const bgm = document.getElementById("bgm");
    const usagi = document.getElementById("usagi");
    const countdownText = document.getElementById("countdown");
    const muteButton = document.getElementById("muteButton");

    // Multiple Chirp sounds
    const chirps = [
        new Audio("chirper1.ogg"),
        new Audio("chirper2.ogg"),
        new Audio("chirper3.ogg")
    ];
    chirps.forEach(chirp => chirp.preload = "auto");

    // Countdown target
    const targetDate = new Date("2025-11-25T09:00:00-08:00").getTime();

    function updateCountdown() {
        const now = new Date().getTime();
        const difference = targetDate - now;

        if (difference <= 0) {
            countdownText.innerHTML = "The presentation has started!";
            return;
        }

        const days = Math.floor(difference / (1000 * 60 * 60 * 24));
        const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((difference % (1000 * 60)) / 1000);

        countdownText.innerHTML = `${days}d ${hours}h ${minutes}m ${seconds}s`;
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);

    // Enable audio on first click
    function enableAudioOnce() {
        bgm.muted = false;
        bgm.volume = 1.0;
        bgm.play();
        document.removeEventListener("click", enableAudioOnce);
    }
    document.addEventListener("click", enableAudioOnce);

    // Usagi animation + sound
    document.querySelector(".logo").addEventListener("click", () => {
        usagi.classList.remove("slide-down");
        usagi.classList.add("slide-up");

        const randomChirp = chirps[Math.floor(Math.random() * chirps.length)];
        randomChirp.currentTime = 0;
        randomChirp.play().catch(err => console.log("Audio blocked:", err));

        setTimeout(() => {
            usagi.classList.remove("slide-up");
            usagi.classList.add("slide-down");
        }, 4000);
    });

    // Mute Button
    muteButton.addEventListener("click", () => {
        bgm.muted = !bgm.muted;
        muteButton.textContent = bgm.muted ? "🔇" : "🔈";
    });

    // --- Timezone + Local Event Time ---
    function updateTimezoneInfo() {
        const timezoneInfo = document.getElementById("timezoneInfo");

        const userTZ = Intl.DateTimeFormat().resolvedOptions().timeZone;
        const eventDatePST = new Date("2025-11-25T09:00:00-08:00");
        const now = new Date();

        const timeLeft = eventDatePST - now;

        const eventLocalString = eventDatePST.toLocaleString([], {
            dateStyle: "full",
            timeStyle: "short"
        });

        timezoneInfo.innerHTML =
            `Presentation Time in Your Local Time:<br><b>${eventLocalString}</b>`;

        if (timeLeft <= 0) {
            timezoneInfo.style.color = "#4aff4a";  
            timezoneInfo.innerHTML = "The presentation has started!";
        } else if (timeLeft < 60 * 60 * 1000) {
            timezoneInfo.style.color = "#ff4a4a";  
        } else if (timeLeft < 24 * 60 * 60 * 1000) {
            timezoneInfo.style.color = "#ff9e4a"; 
        } else if (timeLeft < 7 * 24 * 60 * 60 * 1000) {
            timezoneInfo.style.color = "#ffda6b"; 
        } else {
            timezoneInfo.style.color = "#ccc";     
        }
    }

    updateTimezoneInfo();
    setInterval(updateTimezoneInfo, 1000);


    // ---- PEAM EASTER EGG (appears after 4 clicks) ----
    let clickCount = 0;
    const peam = document.getElementById("peam");

    document.addEventListener("click", () => {
        clickCount++;

        if (clickCount === 4) {
            peam.classList.add("show");

            setTimeout(() => {
                peam.classList.remove("show");
            }, 2000);

            clickCount = 0;
        }
    });
</script>

</body>
</html>
