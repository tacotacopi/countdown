<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>iiSU Presentation Countdown</title>

    <style>
        @font-face {
            font-family: 'ContinuumMedium';
            src: url('ContinuumMedium.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
        }

        body {
            background: #111;
            color: #fff;
            font-family: 'ContinuumMedium', sans-serif;
            text-align: center;
            padding-top: 50px;
        }

        h1 {
            font-size: 48px;
            margin-top: 20px;
            margin-bottom: 10px;
            cursor: pointer;  /* Make it look clickable */
        }

        .subtitle {
            font-size: 18px;
            color: #bbb;
            margin-bottom: 40px;
        }

        #countdown {
            font-size: 36px;
            letter-spacing: 2px;
            margin-bottom: 40px;
        }

        img.logo {
            width: 250px;
            margin-bottom: 20px;
            cursor: pointer;  /* Make it look clickable */
        }

        /* Usagi GIF styles */
        #usagi {
            position: fixed;
            bottom: -300px;
            right: 20px;
            width: 200px;
            z-index: 9999;
            background: rgba(0,0,0,0);
            transition: transform 0.5s ease; /* Transitioning transform for smoother animation */
        }

        .slide-up {
            transform: translateY(-320px); /* Moves the GIF up */
        }

        .slide-down {
            transform: translateY(300px); /* Moves it back down */
        }

        /* Mute Button Styles */
        #muteButton {
            position: fixed;
            top: 10px;
            left: 10px;
            background-color: rgba(0, 0, 0, 0.6);
            color: #fff;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
            font-size: 14px;
            border-radius: 5px;
            z-index: 10000;
        }

        #muteButton:hover {
            background-color: rgba(0, 0, 0, 0.8);
        }

    </style>
</head>
<body>

    <!-- Background Music -->
    <audio id="bgm" src="music.mp3" autoplay loop muted></audio>

    <!-- Logo -->
    <img src="iisu.png" class="logo" alt="iiSU Logo">

    <h1>iiSU Presentation Countdown</h1>
    <p class="subtitle">Unofficial Website.</p>

    <div id="countdown">Loading...</div>

    <!-- Usagi GIF (hidden by default) -->
    <img id="usagi" src="usagi.gif" alt="Usagi GIF">

    <!-- Mute Button -->
    <button id="muteButton">🔇</button>

<script>
    const bgm = document.getElementById("bgm");
    const usagi = document.getElementById("usagi");
    const countdownText = document.getElementById("countdown");
    const muteButton = document.getElementById("muteButton");

    // NEW: Multiple Chirp sounds
    const chirps = [
        new Audio("chirper1.ogg"),
        new Audio("chirper2.ogg"),
        new Audio("chirper3.ogg")
    ];
    chirps.forEach(chirp => chirp.preload = "auto");

    // Countdown logic
    const targetDate = new Date("2025-11-25T09:00:00-08:00").getTime();

    function updateCountdown() {
        const now = new Date().getTime();
        const difference = targetDate - now;

        if (difference <= 0) {
            countdownText.innerHTML = "The presentation has started!";
            return;
        }

        const days = Math.floor(difference / (1000 * 60 * 60 * 24));
        const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((difference % (1000 * 60)) / 1000);

        countdownText.innerHTML =
            `${days}d ${hours}h ${minutes}m ${seconds}s`;
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);

    function enableAudioOnce() {
        bgm.muted = false;
        bgm.volume = 1.0;
        bgm.play();

        document.removeEventListener("click", enableAudioOnce);
    }

    document.addEventListener("click", enableAudioOnce);

    // --- Trigger Usagi animation and random chirp ---
    document.querySelector(".logo").addEventListener("click", () => {

        // Slide Usagi up
        usagi.classList.remove("slide-down");
        usagi.classList.add("slide-up");

        // Pick a random chirp
        const randomChirp = chirps[Math.floor(Math.random() * chirps.length)];

        // Play random chirp sound
        randomChirp.currentTime = 0;  // Restart sound
        randomChirp.play().catch(err => console.log("Audio play blocked:", err));

        // Slide back down after 4s
        setTimeout(() => {
            usagi.classList.remove("slide-up");
            usagi.classList.add("slide-down");
        }, 4000);
    });

    // Mute/Unmute Button functionality
    muteButton.addEventListener("click", () => {
        bgm.muted = !bgm.muted;  // Toggle mute
        muteButton.textContent = bgm.muted ? "🔇" : "🔈";  // Toggle button text
    });
</script>

</body>
</html>
