<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>iiSU Presentation Countdown</title>

    <style>
        @font-face {
            font-family: 'ContinuumMedium';
            src: url('ContinuumMedium.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
        }

        body {
            background: #111;
            color: #fff;
            font-family: 'ContinuumMedium', sans-serif;
            text-align: center;
            padding-top: 50px;
        }

        h1 {
            font-size: 48px;
            margin-top: 20px;
            margin-bottom: 10px;
            cursor: pointer;
        }

        .subtitle {
            font-size: 18px;
            color: #bbb;
            margin-bottom: 40px;
        }

        #countdown {
            font-size: 36px;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }

        #timezoneInfo {
            font-size: 18px;
            color: #ccc;
            margin-bottom: 40px;
        }

        img.logo {
            width: 250px;
            margin-bottom: 20px;
            cursor: pointer;
        }

        #usagi {
            position: fixed;
            bottom: -300px;
            right: 20px;
            width: 200px;
            z-index: 9999;
            background: rgba(0,0,0,0);
            transition: transform 0.5s ease;
        }

        .slide-up {
            transform: translateY(-320px);
        }

        .slide-down {
            transform: translateY(300px);
        }

        #muteButton {
            position: fixed;
            top: 10px;
            left: 10px;
            background-color: rgba(0, 0, 0, 0.6);
            color: #fff;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
            font-size: 14px;
            border-radius: 5px;
            z-index: 10000;
        }

        #muteButton:hover {
            background-color: rgba(0, 0, 0, 0.8);
        }

        /* ---- PEAM POPUP ---- */
#peam {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 250px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.6s ease;
    z-index: 10001;
}

        #peam.show {
            opacity: 1;
        }
    </style>
</head>
<body>

    <!-- Background Music -->
    <audio id="bgm" src="music.mp3" autoplay loop muted></audio>

    <!-- Logo -->
    <img src="iisu.png" class="logo" alt="iiSU Logo">

    <h1>iiSU Presentation Countdown</h1>
    <p class="subtitle">Unofficial Website.</p>

    <div id="countdown">Loading...</div>

    <div id="timezoneInfo">finding your time zone...</div>

    <img id="usagi" src="usagi.gif" alt="Usagi GIF">
    
    <img id="peam" src="peam.png" alt="Peam png">

    <button id="muteButton">🔇</button>

<script>
    const bgm = document.getElementById("bgm");
    const usagi = document.getElementById("usagi");
    const countdownText = document.getElementById("countdown");
    const muteButton = document.getElementById("muteButton");

    const chirps = [
        new Audio("chirper1.ogg"),
        new Audio("chirper2.ogg"),
        new Audio("chirper3.ogg")
    ];
    chirps.forEach(chirp => { chirp.preload = "auto"; chirp.load(); });

    const targetDate = new Date("2025-11-25T09:00:00-08:00").getTime();

    function updateCountdown() {
        const now = Date.now();
        const difference = targetDate - now;

        if (difference <= 0) {
            countdownText.innerHTML = "The presentation has started!";
            return;
        }

        const days = Math.floor(difference / (1000 * 60 * 60 * 24));
        const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((difference % (1000 * 60)) / 1000);

        countdownText.innerHTML = `${days}d ${hours}h ${minutes}m ${seconds}s`;
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);

    // Enable audio on first click
    function enableAudioOnce() {
        bgm.muted = false;
        bgm.volume = 1.0;
        bgm.play();
        document.removeEventListener("click", enableAudioOnce);
    }
    document.addEventListener("click", enableAudioOnce, { once: true });

    // Usagi on logo click
    document.querySelector(".logo").addEventListener("click", () => {
        usagi.classList.remove("slide-down");
        usagi.classList.add("slide-up");

        const randomChirp = chirps[Math.floor(Math.random() * chirps.length)];
        randomChirp.currentTime = 0;
        randomChirp.play().catch(() => {});

        setTimeout(() => {
            usagi.classList.remove("slide-up");
            usagi.classList.add("slide-down");
        }, 4000);
    });

    muteButton.addEventListener("click", () => {
        bgm.muted = !bgm.muted;
        muteButton.textContent = bgm.muted ? "🔇" : "🔈";
    });

    function updateTimezoneInfo() {
        const timezoneInfo = document.getElementById("timezoneInfo");

        const eventDatePST = new Date("2025-11-25T09:00:00-08:00");
        const now = new Date();
        const timeLeft = eventDatePST - now;

        const eventLocalString = eventDatePST.toLocaleString([], {
            dateStyle: "full",
            timeStyle: "short"
        });

        timezoneInfo.innerHTML =
            `Presentation Time in Your Local Time:<br><b>${eventLocalString}</b>`;

        if (timeLeft <= 0) {
            timezoneInfo.style.color = "#4aff4a";
            timezoneInfo.innerHTML = "The presentation has started!";
        } else if (timeLeft < 60 * 60 * 1000) {
            timezoneInfo.style.color = "#ff4a4a";
        } else if (timeLeft < 24 * 60 * 60 * 1000) {
            timezoneInfo.style.color = "#ff9e4a";
        } else if (timeLeft < 7 * 24 * 60 * 60 * 1000) {
            timezoneInfo.style.color = "#ffda6b";
        } else {
            timezoneInfo.style.color = "#ccc";
        }
    }

    updateTimezoneInfo();
    setInterval(updateTimezoneInfo, 1000);

    function spawnFallingPeam() {
        const img = document.createElement("img");
        img.src = "peam.png";
        img.style.position = "fixed";
        img.style.width = "80px";

        // Random X across the entire top border
        const x = Math.random() * (window.innerWidth - 80);
        img.style.left = x + "px";
        img.style.top = "-120px"; // start slightly off screen

        img.style.zIndex = 20000;

        // Animation styles
        img.style.transition = "transform 2.2s ease-in, opacity 1s ease-in 1.5s";

        document.body.appendChild(img);

        // Let browser place it before animating
        requestAnimationFrame(() => {
            // Fall distance
            const fallDistance = window.innerHeight + 200;
            img.style.transform = `translateY(${fallDistance}px) rotate(${Math.random()*60 - 30}deg)`;
            img.style.opacity = "0";
        });

        // Remove after animation
        setTimeout(() => {
            img.remove();
        }, 2500);
    }

    // When you click the countdown, spawn a BURST of peams
    countdownText.addEventListener("click", (e) => {
    e.stopPropagation(); 
    const burstCount = 6 + Math.floor(Math.random() * 5);
    for (let i = 0; i < burstCount; i++) {
        setTimeout(spawnFallingPeam, i * 120);
    }
});

    
    let clickCount = 0;
    let peamShown = false;
    const peam = document.getElementById("peam");

    document.addEventListener("click", () => {
        if (peamShown) return;
        clickCount++;

        if (clickCount === 4) {
            peam.classList.add("show");
            setTimeout(() => peam.classList.remove("show"), 2000);
            peamShown = true;
        }
    });
</script>


</body>
</html>
