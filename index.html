<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>iiSU Presentation</title>

    <style>
        @font-face {
            font-family: 'ContinuumMedium';
            src: url('ContinuumMedium.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
        }

        body {
            background: #111;
            color: #fff;
            font-family: 'ContinuumMedium', sans-serif;
            text-align: center;
            padding-top: 50px;
        }

        h1 {
            font-size: 48px;
            margin-top: 20px;
            margin-bottom: 10px;
            cursor: pointer;
        }

        .subtitle {
            font-size: 18px;
            color: #bbb;
            margin-bottom: 40px;
        }

        #countdown {
            font-size: 36px;
            letter-spacing: 2px;
            margin-bottom: 20px;
            cursor: pointer;
        }

        img.logo {
            width: 250px;
            margin-bottom: 20px;
            cursor: pointer;
        }

        #usagi {
            position: fixed;
            bottom: -300px;
            right: 20px;
            width: 200px;
            z-index: 9999;
            background: rgba(0,0,0,0);
            transition: transform 0.5s ease;
        }

        .slide-up {
            transform: translateY(-320px);
        }

        .slide-down {
            transform: translateY(300px);
        }

        #muteButton {
            position: fixed;
            top: 10px;
            left: 10px;
            background-color: rgba(0, 0, 0, 0.6);
            color: #fff;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
            font-size: 14px;
            border-radius: 5px;
            z-index: 10000;
        }

        /* ---- Peam Popup ---- */
        #peam {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 250px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s ease;
            z-index: 10001;
        }

        #peam.show {
            opacity: 1;
        }
    </style>
</head>
<body>

    <!-- Background Music -->
    <audio id="bgm" src="music.mp3" autoplay loop muted></audio>

    <img src="iisu.png" class="logo" alt="iiSU Logo">

    <h1>iiSU Presentation</h1>
    <p class="subtitle">Unofficial Website.</p>

    <!-- Static Spring 2026 text -->
    <div id="countdown">Spring 2026</div>

    <!-- YouTube -->
    <div id="videoEmbed" style="margin-bottom: 40px;">
        <iframe width="560" height="315" src="https://www.youtube.com/embed/bpTpCR1IUts"
                frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                allowfullscreen></iframe>
    </div>

    <img id="usagi" src="usagi.gif" alt="Usagi GIF">
    <img id="peam" src="peam.png" alt="Peam png">

    <button id="muteButton">🔇</button>

<script>
    const bgm = document.getElementById("bgm");
    const usagi = document.getElementById("usagi");
    const countdownText = document.getElementById("countdown");
    const muteButton = document.getElementById("muteButton");

    const chirps = [
        new Audio("chirper1.ogg"),
        new Audio("chirper2.ogg"),
        new Audio("chirper3.ogg")
    ];
    chirps.forEach(chirp => { chirp.preload = "auto"; chirp.load(); });

    // Enable audio on first click
    function enableAudioOnce() {
        bgm.muted = false;
        bgm.volume = 1.0;
        bgm.play();
        document.removeEventListener("click", enableAudioOnce);
    }
    document.addEventListener("click", enableAudioOnce, { once: true });

    // Usagi popup on logo click
    document.querySelector(".logo").addEventListener("click", () => {
        usagi.classList.remove("slide-down");
        usagi.classList.add("slide-up");

        const chirp = chirps[Math.floor(Math.random() * chirps.length)];
        chirp.currentTime = 0;
        chirp.play().catch(() => {});

        setTimeout(() => {
            usagi.classList.remove("slide-up");
            usagi.classList.add("slide-down");
        }, 4000);
    });

    muteButton.addEventListener("click", () => {
        bgm.muted = !bgm.muted;
        muteButton.textContent = bgm.muted ? "🔇" : "🔈";
    });

    // Falling Peam
    function spawnFallingPeam() {
        const img = document.createElement("img");
        img.src = "peam.png";
        img.style.position = "fixed";
        img.style.width = "80px";
        img.style.left = (Math.random() * (window.innerWidth - 80)) + "px";
        img.style.top = "-120px";
        img.style.zIndex = 20000;
        img.style.transition = "transform 2.2s ease-in, opacity 1s ease-in 1.5s";

        document.body.appendChild(img);

        requestAnimationFrame(() => {
            img.style.transform = `translateY(${window.innerHeight + 200}px) rotate(${Math.random()*60 - 30}deg)`;
            img.style.opacity = "0";
        });

        setTimeout(() => img.remove(), 2500);
    }

    // Peam burst when clicking Spring 2026
    countdownText.addEventListener("click", (e) => {
        e.stopPropagation();
        const burst = 6 + Math.floor(Math.random() * 5);
        for (let i = 0; i < burst; i++) {
            setTimeout(spawnFallingPeam, i * 120);
        }
    });

</script>

</body>
</html>
