<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- IMPORTANT FOR MOBILE -->
    <title>iiSU.lol</title>

    <style>
        @font-face {
            font-family: 'ContinuumMedium';
            src: url('ContinuumMedium.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
        }

        body {
            background: #111;
            color: #fff;
            font-family: 'ContinuumMedium', sans-serif;
            text-align: center;
            padding-top: 40px;
            opacity: 0;
            animation: fadeIn 1.2s ease forwards;
            margin: 0;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        h1 {
            font-size: clamp(28px, 6vw, 48px);
            margin-top: 10px;
            margin-bottom: 5px;
            cursor: pointer;
        }

        .subtitle {
            font-size: clamp(14px, 4vw, 18px);
            color: #bbb;
            margin-bottom: 25px;
        }

        /* Wrapper for blossoms */
        #countdown-wrapper {
            position: relative;
            display: inline-block;
        }

        #countdown {
            font-size: clamp(24px, 5vw, 36px);
            letter-spacing: 1.5px;
            margin-top: -5px;
            margin-bottom: 15px;
            cursor: pointer;
            position: relative;
            z-index: 10;
            display: inline-block;
            text-shadow: 0 0 15px rgba(255,150,200,0.8);
        }

        /* Blossom floating animation */
        #countdown::after {
            content: "";
            position: absolute;
            right: -40px;
            top: -5px;
            font-size: clamp(18px, 4vw, 24px);
            animation: blossomFloat 3s ease-in-out infinite;
        }

        @keyframes blossomFloat {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(8deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        img.logo {
            width: clamp(160px, 40vw, 250px);
            margin-bottom: 15px;
            cursor: pointer;
        }

        /* ---- PANELS ---- */
        .panel-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px auto 30px;
            flex-wrap: wrap;
            padding: 0 15px;
        }

        .panel {
            background: #1a1a1a;
            border: 1px solid #333;
            padding: 20px;
            border-radius: 12px;
            width: min(340px, 100%);
            text-align: left;
            box-shadow: 0 0 25px rgba(0,0,0,0.4);
            animation: fadeIn 1.2s ease forwards;
            display: flex;
            flex-direction: column;
        }

        .panel-header img {
            width: 28px;
            height: 28px;
        }

        .panel-header h2 {
            margin: 0;
            color: #73b7ff;
            font-size: clamp(18px, 4.5vw, 22px);
        }

        .panel ul li {
            margin: 6px 0;
            color: #ccc;
            font-size: clamp(14px, 3.5vw, 16px);
        }

        .price {
            margin-top: 12px;
            font-size: clamp(16px, 4vw, 18px);
        }

        /* ---- Usagi ---- */
        #usagi {
            position: fixed;
            bottom: -260px;
            right: 10px;
            width: clamp(120px, 35vw, 200px);
            z-index: 9999;
            transition: transform 0.5s ease;
        }

        .slide-up { transform: translateY(-260px); }
        .slide-down { transform: translateY(260px); }

        /* ---- Mute Button ---- */
        #muteButton {
            position: fixed;
            top: 10px;
            left: 10px;
            background-color: rgba(0, 0, 0, 0.6);
            color: #fff;
            border: none;
            padding: 12px 18px;
            cursor: pointer;
            font-size: 16px;
            border-radius: 8px;
            z-index: 10000;
            touch-action: manipulation;
        }

        /* YouTube iframe responsive */
        #videoEmbed iframe {
            width: 90vw !important;
            height: calc(90vw * 0.5625) !important; /* 16:9 */
            max-width: 560px;
            max-height: 315px;
        }

        /* Blossoms */
        @keyframes blossomFall {
            0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(60px) rotate(360deg); opacity: 0; }
        }

        .blossom {
            position: absolute;
            font-size: clamp(16px, 4vw, 20px);
            pointer-events: none;
            z-index: 5;
        }
    </style>
</head>


<body>

    <!-- Background Music -->
    <audio id="bgm" src="music.mp3" autoplay loop muted></audio>

    <img src="iisu.png" class="logo" alt="iiSU Logo">

    <h1>iiSU Presentation</h1>
    <p class="subtitle">Unofficial Website.</p>

    <div id="countdown-wrapper">
        <div id="countdown">Spring 2026</div>
    </div>

    <div class="panel-container">
        <!-- your two panels unchanged -->
        <!-- (content omitted for space, keep exactly as you had it!) -->
    </div>

    <div id="videoEmbed" style="margin-bottom: 40px;">
        <iframe src="https://www.youtube.com/embed/bpTpCR1IUts"
                frameborder="0" allowfullscreen></iframe>
    </div>

    <img id="usagi" src="usagi.gif">
    <img id="peam" src="peam.png">

    <button id="muteButton">🔇</button>

<script>
    /* All your JavaScript unchanged except for one mobile fix */

    const bgm = document.getElementById("bgm");
    const usagi = document.getElementById("usagi");
    const countdownText = document.getElementById("countdown");
    const muteButton = document.getElementById("muteButton");

    const chirps = [ new Audio("chirper1.ogg"), new Audio("chirper2.ogg"), new Audio("chirper3.ogg") ];
    chirps.forEach(chirp => { chirp.preload = "auto"; chirp.load(); });

    function enableAudioOnce() {
        bgm.muted = false;
        bgm.volume = 1.0;
        bgm.play();
    }
    document.addEventListener("click", enableAudioOnce, { once: true });

    document.querySelector(".logo").addEventListener("click", () => {
        /* MOBILE USAGI FIX — smaller rise on phones */
        const rise = window.innerWidth < 600 ? "-200px" : "-320px";

        usagi.style.transform = `translateY(${rise})`;

        const chirp = chirps[Math.floor(Math.random() * chirps.length)];
        chirp.currentTime = 0;
        chirp.play().catch(() => {});

        setTimeout(() => {
            usagi.style.transform = "translateY(260px)";
        }, 4000);
    });

    muteButton.addEventListener("click", () => {
        bgm.muted = !bgm.muted;
        muteButton.textContent = bgm.muted ? "🔇" : "🔈";
    });

    function spawnFallingPeam() {
        const img = document.createElement("img");
        img.src = "peam.png";
        img.style.position = "fixed";
        img.style.width = "70px";
        img.style.left = (Math.random() * (window.innerWidth - 70)) + "px";
        img.style.top = "-120px";
        img.style.zIndex = 20000;
        img.style.transition = "transform 2.2s ease-in, opacity 1s ease-in 1.5s";
        document.body.appendChild(img);

        requestAnimationFrame(() => {
            img.style.transform = `translateY(${window.innerHeight + 200}px) rotate(${Math.random()*60 - 30}deg)`;
            img.style.opacity = "0";
        });

        setTimeout(() => img.remove(), 2500);
    }

    function spawnBlossom() {
        const wrapper = document.getElementById("countdown-wrapper");
        const blossom = document.createElement("div");
        blossom.className = "blossom";

        const emojis = ["🌺","🌸","🌿","🌼","🍃"];
        blossom.textContent = emojis[Math.floor(Math.random() * emojis.length)];

        blossom.style.left = (Math.random() * wrapper.offsetWidth) + "px";
        blossom.style.top = "-20px";
        blossom.style.animation = "blossomFall 4s linear forwards";

        wrapper.appendChild(blossom);
        setTimeout(() => blossom.remove(), 4000);
    }

    setInterval(spawnBlossom, 1300);

    countdownText.addEventListener("click", (e) => {
        e.stopPropagation();
        const burst = 6 + Math.floor(Math.random() * 5);
        for (let i = 0; i < burst; i++) {
            setTimeout(spawnFallingPeam, i * 120);
        }
    });
</script>

</body>
</html>
